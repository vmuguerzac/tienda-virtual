<a class="btn btn-link px-0 mb-3" routerLink="/productos">← Volver a productos</a>

@if(error()){
    <div class="alert alert-danger">{{ error() }}</div>
}

@if(producto(); as p){
    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-5 d-flex align-items-center justify-content-center p-4 bg-white">
                <img class="img-fluid" [src]="p.imagenProducto || 'https://placehold.co/400x300?text=Sin+imagen'"
                    [alt]="p.nombreProducto">
            </div>
            <div class="col-md-7">
                <div class="card-body p-4">
                    <h2 class="card-title">{{ p.nombreProducto }}</h2>
                    <p class="text-muted">{{ p.descripcion }}</p>
                    <p class="fs-3 fw-bold mb-0">{{ p.precio | currency:'PEN':'S/ ' }}</p>
                    <p class="text-muted small">Precio final con IGV: {{ precioConIGV(p.precio) }}</p>
                    <button class="btn btn-primary" (click)="agregarAlCarrito(p)" [disabled]="p.sinStock">
                        {{ p.sinStock ? 'Fuera de stock' : 'Agregar al carrito' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
}
