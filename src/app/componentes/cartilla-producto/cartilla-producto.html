<div class="card mt-4 shadow">
    <div class="d-flex align-items-center">
        <div class="card-body">
            <h5 class="card-title">{{productoAMostrar().nombreProducto.toUpperCase()}}</h5>
            <p class="card-text">{{productoAMostrar().descripcion}}</p>
            <p class="card-text">S/ {{productoAMostrar().precio}}</p>
            <img [src]="productoAMostrar().imagenProducto" style="width: 120px; height:auto"/>
            <br />
            @if(productoAMostrar().sinStock){
                <p class="text-danger">Fuera de stock</p>
            }@else {
                <p class="text-success">Disponible</p>
            }
            <br />
            <button class="btn btn-primary" (click)="onAgregarAlCarrito()"
            [disabled]="productoAMostrar().sinStock">Agregar</button>
        </div>
    </div>
</div>
